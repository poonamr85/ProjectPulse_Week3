[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-project-status-agent"
version = "0.1.0"
description = "Notion ingestion, structured history, and Mem0 project memory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tools = ["langchain>=1,<2"]
model = ["langchain>=1,<2", "langchain-openai>=1,<2"]
react = ["langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2", "langgraph-checkpoint-sqlite>=3,<5"]
ui = ["langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2", "langgraph-checkpoint-sqlite>=3,<5", "streamlit>=1.67,<2", "python-docx>=1,<2", "reportlab>=4,<5", "altair>=5,<7", "pandas>=2,<4", "vl-convert-python>=1.7,<2"]
dev = ["ruff>=0.14,<1", "pypdf>=5,<8"]
agent = ["langchain>=1,<2", "langgraph>=1,<2", "langchain-openai>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "langsmith>=0.4,<1", "streamlit>=1.67,<2"]

[project.scripts]
project-status = "project_status_agent.cli:main"

[tool.setuptools.packages.find]
include = ["project_status_agent*"]
